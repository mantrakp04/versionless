name: Publish npm Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        if: github.event_name == 'push'
        shell: bash
        run: |
          manifest_version="$(node -p "require('./packages/cli/package.json').version")"
          tag_version="${GITHUB_REF_NAME#cli-v}"
          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "CLI version $manifest_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Test core
        run: bun test
        working-directory: packages/core

      - name: Type-check core
        run: bun run check-types
        working-directory: packages/core

      - name: Test query catalog
        run: bun test
        working-directory: packages/query-catalog

      - name: Type-check query catalog
        run: bun run check-types
        working-directory: packages/query-catalog

      - name: Test CLI
        run: bun test
        working-directory: packages/cli

      - name: Type-check CLI
        run: bun run check-types
        working-directory: packages/cli

      - name: Pack release tarballs
        shell: bash
        run: |
          bun pm pack --cwd packages/core --filename "$RUNNER_TEMP/versionless-core.tgz"
          bun pm pack --cwd packages/query-catalog --filename "$RUNNER_TEMP/versionless-query-catalog.tgz"
          bun pm pack --cwd packages/cli --filename "$RUNNER_TEMP/versionless-cli.tgz"

      - name: Publish with npm trusted publishing
        shell: bash
        run: |
          publish_package() {
            local package_name="$1"
            local package_version="$2"
            local tarball="$3"

            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published"
              return
            fi

            npm publish --access public "$tarball"
          }

          version="$(node -p "require('./packages/cli/package.json').version")"
          publish_package "@versionless/core" "$version" "$RUNNER_TEMP/versionless-core.tgz"
          publish_package "@versionless/query-catalog" "$version" "$RUNNER_TEMP/versionless-query-catalog.tgz"
          publish_package "@versionless/cli" "$version" "$RUNNER_TEMP/versionless-cli.tgz"
