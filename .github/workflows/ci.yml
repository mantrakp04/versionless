name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deployments are owned by Railway IaC and Vercel's Git integration. CI only
# reads these values when a focused test needs them; SKIP_ENV_VALIDATION stays
# on so forked PRs — which get no secrets — still validate cleanly.
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
  HEXCLAVE_PROJECT_ID: ${{ secrets.HEXCLAVE_PROJECT_ID }}
  HEXCLAVE_SECRET_SERVER_KEY: ${{ secrets.HEXCLAVE_SECRET_SERVER_KEY }}
  VERSIONLESS_API_KEY: ${{ secrets.VERSIONLESS_API_KEY }}
  CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
  SKIP_ENV_VALIDATION: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run test
      # Both deployment topologies render from one Envoy source and must pass
      # Envoy's own bootstrap validation.
      - run: bun run otel:validate
      # Transform integrity: every change's wire-shape fixtures + tolerant-reader probes.
      - run: bun run versionless verify
        working-directory: apps/demo

  # The Postgres-change gate: schema changes ship as compat-linted, idempotent
  # migrations — and because the drizzle schema is the parent source of the
  # API wire types, the change must also leave both app surfaces green.
  #
  # ClickHouse tables are owned by the standard Collector exporter now, not an
  # application migration package. Railway provisions ClickHouse + OTLP infra;
  # CI must never point migrations at those deployed resources.
  db-compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: versionless
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Ephemeral service container ONLY — never point CI migrations at the
    # Railway database; this override shadows the workflow-level secret.
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/versionless
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # 1. No schema drift: a schema change without a committed migration fails.
      - run: bun run db:generate && git diff --exit-code -- packages/db/src/migrations
      # 2. Migrations are backwards/forwards compatible (expand → contract lint).
      - run: bun run db:check
      # 3. Migrations apply to a fresh database — twice, proving idempotency.
      - run: bun run --cwd packages/db db:migrate && bun run --cwd packages/db db:migrate
      # 4. API versioning: the schema feeds both wire surfaces, so each diff
      #    must be fully covered by its registered change chain.
      - run: bun run versionless:check
        working-directory: apps/demo
      - run: bun run versionless:check
        working-directory: apps/server

  # Apply the same committed, compatibility-checked migrations to production
  # after every successful merge to main. The Production environment can be
  # configured to require approval through GitHub's environment protection
  # rules. Drizzle journals applied migrations, so runs without new migrations
  # are no-ops.
  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, db-compat]
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply production database migrations
        run: bun run db:migrate
        working-directory: packages/db
