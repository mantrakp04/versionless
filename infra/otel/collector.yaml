extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource/versionless:
    attributes:
      - key: versionless.team.id
        from_context: metadata.x-versionless-team-id
        action: upsert
      - key: versionless.project.id
        from_context: metadata.x-versionless-project-id
        action: upsert

exporters:
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    database: ${env:CLICKHOUSE_DATABASE}
    create_schema: true
    ttl: 4320h
    async_insert: true
    compress: lz4
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      sizer: items
      batch:
        # Dashboard traffic is sparse in production; flush a single request
        # instead of waiting for a seed-sized batch before the timeout starts.
        min_size: 1
        max_size: 5000
        flush_timeout: 1s
        sizer: items
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/versionless]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/versionless]
      exporters: [clickhouse]
